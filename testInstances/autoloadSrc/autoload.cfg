// Load this save straight from the main menu.  kRPC will not run outside a
// game scene -- KRPC.Addon calls Core.StopAll() when CurrentGameScene() is
// None, which is what the main menu is -- so an unattended instance has to get
// itself into a save before anything can connect.
BOOSTERLAND_AUTOLOAD
{
	folder = default
	save = quicksave

	// SPACECENTER or FLIGHT.  Use SPACECENTER: Game.Start() into FLIGHT needs
	// FlightDriver primed with a valid active vessel, and without that it
	// silently fails to transition -- the menu stays up while Update() keeps
	// running, which is very hard to tell from a hang.  The space centre is a
	// real scene as far as kRPC is concerned, so the server starts there, and
	// quickfly.py loads the quicksave itself exactly as it does interactively.
	scene = SPACECENTER
}
